<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>REGISTER</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header>
            <h1>REGISTER</h1>
        </header>
        <main>
            <form>
                <div class="finput">
                    <p>Email</p>
                    <input type="email"/>
                </div>
                <div class="finput">
                    <p>Password</p>
                    <input type="password"/>
                </div>
                <div>
                    <p>Radios</p>
                    <div>
                        <div>
                            <input type="radio" id="radio1" name="radios" />
                            <label for="radio1">First Radio</label>
                        </div>
                        <div>
                            <input type="radio" id="radio2" name="radios" />
                            <label for="radio2">Second Radio</label>
                        </div>
                        <div>
                            <input type="radio" id="radio3" name="radios" disabled />
                            <label for="radio3">Third disabled radio</label>
                        </div>
                    </div>
                </div>
                <div>
                    <p>Checkbox</p>
                    <input type="checkbox" id="checkbox" />
                    <label for="checkbox">Example checkbox</label>
                </div>
                <button type="submit">Sign in</button>
            </form>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
